# ===========================================================================
# DokuWiki for TerraMaster TOS 7 (Docker application)
# ===========================================================================
# Upstream image : dokuwiki/dokuwiki:2026-07-14c (Docker Hub, used unmodified)
#                  -> https://github.com/dokuwiki/dokuwiki
#
# Ports   : host 8179 -> container 8080. The host port is in the
#           TOS-recommended 8000-19999 range and is not one of the reserved
#           ports (22/80/443/445/3306/5050/5432/6379/8181/8443).
# Volumes : all persistent data lives below
#           /Volume1/DockerAppData/dokuwikidocker/. The /Volume* wildcard is
#           deliberately NOT used: the platform does not expand it.
# TOS rules honoured: Docker Hub image with a fixed tag (never ':latest'),
#           container_name == application id, restart: unless-stopped,
#           non-root user, no privileged mode, no network_mode: host, no
#           cap_add, explicit TZ, a healthcheck on the only service, and
#           x-app-meta as the last block.
#
# Why there is no entrypoint wrapper any more (since 2026.7.14-2):
#   The image is designed to run unprivileged. Its own entrypoint
#   (/dokuwiki-entrypoint.sh) prepares the /storage volume (copies the core
#   data, symlinks the bundled plugins and templates) and then starts Apache,
#   which listens on the unprivileged port 8080 - no root needed. The previous
#   package replaced that entrypoint with `php -S`, which
#     (a) never ran the storage setup, so conf/ (accounts, ACL, settings) stayed
#         container-local and was lost on every container recreate, and
#     (b) served the whole document root as static files, so /data/pages/*.txt
#         and /data/media/* were downloadable **without** login, bypassing the
#         wiki ACL.
#   Using the upstream entrypoint fixes both. The volume is split into the
#   three directories the image itself anchors in /storage - data, conf, lib -
#   so pages, attachments, revisions, accounts, ACL rules and installed
#   extensions all persist, and the host layout stays the one users already
#   know (data/, conf/, lib/ below DockerAppData/dokuwikidocker/).
#
# NOTE for maintainers: never place a comment line directly in front of a
# "- value" sequence item (ports, volumes, ...). The official
# TOSAppSelfTestingTool parses the compose file line by line; a comment inside
# a sequence makes it skip its permission sync, the mounted directories stay
# root-owned and the non-root container cannot write into them.

services:
  dokuwikidocker:
    image: dokuwiki/dokuwiki:2026-07-14c
    container_name: dokuwikidocker
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "8179:8080"
    environment:
      TZ: "Asia/Shanghai"
      PHP_TIMEZONE: "Asia/Shanghai"
      PHP_UPLOADLIMIT: "128M"
      PHP_MEMORYLIMIT: "256M"
    volumes:
      - /Volume1/DockerAppData/dokuwikidocker/data:/storage/data
      - /Volume1/DockerAppData/dokuwikidocker/conf:/storage/conf
      - /Volume1/DockerAppData/dokuwikidocker/lib:/storage/lib
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail-with-body http://127.0.0.1:8080/health.php || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# TOS App Center web metadata (must be the last block of the file):
# web.port is the published host port above, protocol is http.
x-app-meta:
  web:
    port: 8179
    protocol: http
